name: furniture_erp
description: فورني فلو (FurniFlow) - نظام متكامل لإدارة معارض الموبيليا والمخازن وورش التنجيد
publish_to: 'none'
version: 1.2.10+41

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  intl: ^0.20.3
  local_auth: ^2.2.0
  sqflite_common_ffi: ^2.4.5
  sqlite3_flutter_libs: ^0.6.0+eol
  sqflite_common_ffi_web: ^1.2.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
